name: CI

# Shared org CI (ADR-003): logic lives in liora-app/devops. PRs only, plus main when the
# hook set changes — that re-seeds the pre-commit cache every PR can restore.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: liora-app/devops/.github/workflows/reusable-checks.yml@ci/26-e2e-tests-input
    with:
      # Playwright without the GPU-only tests (scripts/ci-e2e.sh); the full suite runs locally.
      e2e-tests: true
