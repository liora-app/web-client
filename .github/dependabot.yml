version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Monthly + one grouped PR: each Dependabot PR costs CI minutes.
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # Conventional PR titles ("ci(deps): bump ...") so the PR-title check passes.
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Landing dependencies (ADR-006). Monthly + one grouped PR, like Actions above:
  # every Dependabot PR costs CI minutes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns:
          - "*"
